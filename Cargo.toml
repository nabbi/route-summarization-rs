[package]
name = "route-summarization"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Aggregate IPv4/IPv6 CIDR prefixes into their minimal covering set, with SPF ip4:/ip6: support"
license = "GPL-3.0-or-later"
authors = ["Nic Boet"]
homepage = "https://github.com/nabbi/route-summarization"
keywords = ["cidr", "ip", "aggregation", "spf", "networking"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "aggregate-cidr"
path = "src/main.rs"

[dependencies]

[profile.release]
lto = true
codegen-units = 1
strip = true
